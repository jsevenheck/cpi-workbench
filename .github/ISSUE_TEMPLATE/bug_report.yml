name: Bug report
description: Something does not work, or behaves differently from Cloud Integration.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove anything confidential (customer data, credentials, tenant URLs) before you post.
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: 0.3.0 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [XSLT Mapping, Groovy Script, Message Mapping functions, XSD validation, XPath, Flow Steps, iFlow import, MCP server, Desktop app, Command line, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The input message, the mapping or script, and what you did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: If it differs from CPI, what does your tenant return?
    validations:
      required: true
