name: build

# Windows and macOS minutes count 2x and 10x on private repositories, so pushes and pull requests
# run on Linux only. Tags (v*) and manual runs (workflow_dispatch) run all three systems.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest","macos-14"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: Unit tests (both Saxon and both Groovy engines)
        run: mvn -B -f engine/pom.xml verify
      - name: Workload on the JVM engines
        run: |
          python3 engine/native/workload.py java -jar engine/xml-he99/target/cpiwb-xml-he99.jar serve --stdio
          python3 engine/native/workload.py java -jar engine/xml-he12/target/cpiwb-xml-he12.jar serve --stdio
      - name: Demo project test cases
        run: |
          java -jar engine/xml-he99/target/cpiwb-xml-he99.jar test examples/demo-project/tests
          java -jar engine/groovy-v1/target/cpiwb-groovy-v1.jar test examples/demo-project/tests
          java -jar engine/groovy-v2/target/cpiwb-groovy-v2.jar test examples/demo-project/tests

  desktop:
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon (Intel runners are no longer reliably available).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["windows-latest","macos-14","ubuntu-22.04"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk17
        with: { distribution: temurin, java-version: "17" }
      - name: Java runtime for the Groovy engines (jlink, Java 17 like CPI)
        shell: bash
        run: JAVA_HOME="${{ steps.jdk17.outputs.path }}" engine/groovy/build-jre.sh "$RUNNER_TEMP/jre"
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build engine jars
        run: mvn -B -f engine/pom.xml -DskipTests package
      - name: MSVC environment for native-image (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build native engines
        shell: bash
        run: |
          mkdir -p engine/native/out
          ni=native-image; [ "$RUNNER_OS" = "Windows" ] && ni=native-image.cmd
          for id in he99 he12; do
            "$ni" --no-fallback -march=compatibility -jar engine/xml-$id/target/cpiwb-xml-$id.jar -o engine/native/out/cpiwb-xml-$id
          done
      - name: Smoke-test native engines
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          python3 engine/native/workload.py engine/native/out/cpiwb-xml-he99$ext serve --stdio
          python3 engine/native/workload.py engine/native/out/cpiwb-xml-he12$ext serve --stdio
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install UI dependencies
        working-directory: app
        run: npm ci
      - name: Type-check UI
        working-directory: app
        run: npm run check
      - name: Stage sidecars
        working-directory: app
        env:
          CPIWB_JRE_DIR: ${{ runner.temp }}/jre
        run: node scripts/prepare-sidecars.mjs
      # The shell's own path to the engines (stdio, native executables, bundled JRE) on this OS.
      - name: Shell tests against the bundled engines
        working-directory: app
        env:
          CPIWB_REQUIRE_ENGINES: "1"
          JAVA_HOME: ${{ runner.temp }}/jre
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml
      # Default shell (pwsh on Windows): in Git bash, /usr/bin/link shadows MSVC's link.exe.
      - name: Bundle desktop app
        working-directory: app
        env:
          CPIWB_JRE_DIR: ${{ runner.temp }}/jre
        run: |
          npx tauri build ${{ runner.os == 'Linux' && '--bundles deb,rpm' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: cpi-workbench-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.rpm
            app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn

  ui-e2e:
    needs: engine-tests
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - run: mvn -B -f engine/pom.xml -DskipTests package
      - working-directory: app
        run: npm ci && npm run build && npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser tests (web mode, XSLT + Groovy engines)
        run: |
          java -jar engine/xml-he99/target/cpiwb-xml-he99.jar serve --http 7777 --ui app/dist &
          java -jar engine/groovy-v1/target/cpiwb-groovy-v1.jar serve --http 7778 &
          java -jar engine/groovy-v2/target/cpiwb-groovy-v2.jar serve --http 7779 &
          java -jar engine/xml-he12/target/cpiwb-xml-he12.jar serve --http 7780 &
          for port in 7777 7778 7779 7780; do
            for i in $(seq 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
          done
          # Forward slashes work for bash, Node and Java alike (cygpath exists only on Windows).
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null && tmp="$(cygpath -m "$tmp")"
          demo="$tmp/demo-project"
          cp -r examples/demo-project "$demo"
          node app/e2e/smoke.mjs "$demo"
          rm -rf "$demo" && cp -r examples/demo-project "$demo"
          node app/e2e/groovy.mjs "$demo"
