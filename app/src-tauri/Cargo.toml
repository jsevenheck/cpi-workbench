[package]
name = "cpi-workbench"
version = "0.1.0"
description = "Local simulator for SAP Integration Suite (Cloud Integration) XSLT mappings and Groovy scripts"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jsevenheck/cpi-workbench"
homepage = "https://github.com/jsevenheck/cpi-workbench"

[lib]
name = "cpi_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
